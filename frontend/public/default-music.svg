<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vinyl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="label-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#a1887f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8d6e63;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Vinyl Body -->
  <circle cx="200" cy="200" r="195" fill="url(#vinyl-grad)" stroke="#000" stroke-width="2"/>
  
  <!-- Groove Lines (Simulated) -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#333" stroke-width="1" opacity="0.5"/>

  <!-- Label -->
  <circle cx="200" cy="200" r="70" fill="url(#label-grad)"/>
  
  <!-- Decorative Text/Icon on Label -->
  <path d="M170 240 Q 200 260 230 240" fill="none" stroke="#fdfcf8" stroke-width="2" stroke-opacity="0.6"/>
  <text x="200" y="170" font-family="serif" font-size="24" fill="#fdfcf8" text-anchor="middle" font-weight="bold" opacity="0.9">OurTime</text>
  <text x="200" y="195" font-family="sans-serif" font-size="12" fill="#fdfcf8" text-anchor="middle" opacity="0.7">EST. 2025</text>

  <!-- Music Note Icon -->
  <path d="M190 230 V200 L220 190 V220" stroke="#fdfcf8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <circle cx="185" cy="230" r="8" fill="#fdfcf8" opacity="0.8"/>
  <circle cx="215" cy="220" r="8" fill="#fdfcf8" opacity="0.8"/>

  <!-- Center Hole -->
  <circle cx="200" cy="200" r="8" fill="#f5f5f5" stroke="#d7ccc8" stroke-width="2"/>
</svg>
