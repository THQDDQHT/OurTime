# 生产环境配置 - 使用外部已存在的数据库
# 使用方法: docker compose  up -d --build
#
# 注意：此配置不包含数据库服务，需要连接到外部已运行的数据库
# 请确保：
# 1. 数据库已创建并运行
# 2. 在 .env 文件中配置正确的数据库连接信息（使用 DB_HOST 和 DB_PORT）

services:
  # Java 后端
  neural_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neural_service
    restart: always
    environment:
      # 使用外部数据库，通过环境变量配置
      # 如果数据库在宿主机上，使用 host.docker.internal (Docker Desktop) 或宿主机IP
      # 如果数据库在另一个Docker容器中，使用容器名称或IP
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      APP_UPLOAD_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      ROOT_PASSWORD: ${ROOT_PASSWORD}
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - neural_net
      - db_network # 加入数据库所在的网络

  # Nginx 网关
  nginx:
    image: nginx:alpine
    container_name: neural_gateway
    restart: always
    ports:
      - "17788:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./data/uploads:/usr/share/nginx/html/uploads
    depends_on:
      - neural_service
    networks:
      - neural_net

networks:
  neural_net:
    driver: bridge

  # 数据库网络 - 连接到已存在的网络
  db_network:
    external: true
    name: q2qs_network # 数据库容器所在的网络
