version: '3.8'

services:
  # 1. 数据库
  db:
    image: postgres:15-alpine
    container_name: ourtime_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ourtime_db
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ot_net

  # 2. Java 后端
  backend:
    build: ./backend
    container_name: ourtime_api
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ourtime_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS}
      APP_UPLOAD_PATH: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      - ot_net

  # 3. Nginx 网关
  nginx:
    image: nginx:alpine
    container_name: ourtime_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - ./data/uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    networks:
      - ot_net

networks:
  ot_net:

